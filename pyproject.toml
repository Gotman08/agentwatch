[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwatch"
version = "0.1.0"
description = "Observateur local passif pour Claude Code et Codex : collecte par hooks, detection de repetitions, boucles d'erreurs, appels regroupables et sequences automatisables."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# * Affichage terminal enrichi et exports HTML/SVG du rapport ; jamais charge par le hook.
rich = ["rich>=13"]

[project.scripts]
agentwatch = "agentwatch.cli:main"

[tool.setuptools.packages.find]
include = ["agentwatch*"]
